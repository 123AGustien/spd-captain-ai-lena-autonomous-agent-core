name: SPD v13.1 — Validate and Deploy

on:
  push:
    branches:
      - main
      - command-centre
      - feature/BHR-human-rights-compliance
      - feature/SPD-v13.1-performance-benchmark
      - feature/SPD-v13.1-assessment-latency-catalogue

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # =========================================================
  # VALIDATION
  # =========================================================

  validate:
    name: Validate SPD v13.1
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # =====================================================
      # CORE FILES
      # =====================================================

      - name: Verify Core JavaScript files
        run: |
          set -e

          echo "Checking SPD core modules..."

          test -f engine.js
          test -f captainAILena.js
          test -f fx.js
          test -f energy.js
          test -f risk.js
          test -f scenario.js
          test -f armController.js
          test -f constants/math.constants.js

          echo "CORE FILES: PASS"

      # =====================================================
      # DOMAIN INTEGRATION
      # =====================================================

      - name: Verify Domain Integration Layer
        run: |
          set -e

          echo "Checking domain integration..."

          test -f domainIntegration.js

          echo "domainIntegration.js: PRESENT"

          echo "Checking available domain directories..."

          for domain in FIN BHR DC CYB INF; do
            if [ -d "$domain" ]; then
              echo "$domain directory: PRESENT"
            else
              echo "$domain directory: NOT PRESENT ON THIS BRANCH"
            fi
          done

          echo "DOMAIN INTEGRATION FILE: PASS"

      # =====================================================
      # DOMAIN ENGINE CONTENT
      # =====================================================

      - name: Verify available domain engines
        run: |
          set -e

          echo "Checking authoritative domain engines..."

          checked=0

          if [ -f FIN/finRuleEngine.js ]; then
            grep -q "evaluate" FIN/finRuleEngine.js
            echo "FIN evaluate(): PASS"
            checked=$((checked + 1))
          fi

          if [ -f BHR/BHRRuleEngine.js ]; then
            grep -q "evaluate" BHR/BHRRuleEngine.js
            echo "BHR evaluate(): PASS"
            checked=$((checked + 1))
          fi

          if [ -f DC/DCRuleEngine.js ]; then
            grep -q "evaluate" DC/DCRuleEngine.js
            echo "DC evaluate(): PASS"
            checked=$((checked + 1))
          fi

          if [ -f CYB/CYBRuleEngine.js ]; then
            grep -q "evaluate" CYB/CYBRuleEngine.js
            echo "CYB evaluate(): PASS"
            checked=$((checked + 1))
          fi

          if [ -f INF/INFRuleEngine.js ]; then
            grep -q "evaluate" INF/INFRuleEngine.js
            echo "INF evaluate(): PASS"
            checked=$((checked + 1))
          fi

          echo "Domain engines checked: $checked"

      # =====================================================
      # GOLDEN RULE
      # =====================================================

      - name: Verify Golden Rule pipeline
        run: |
          set -e

          echo "Checking Golden Rule pipeline..."

          grep -q "OBSERVE" captainAILena.js
          grep -q "VERIFY" captainAILena.js
          grep -q "ASSESS" captainAILena.js
          grep -q "DECIDE" captainAILena.js
          grep -q "ACT" captainAILena.js
          grep -q "UPDATE" captainAILena.js

          echo "GOLDEN RULE PIPELINE: PASS"

      # =====================================================
      # HUMAN AUTHORITY
      # =====================================================

      - name: Verify governance controls
        run: |
          set -e

          echo "Checking human authority controls..."

          grep -q "HUMAN_OPERATOR" domainIntegration.js
          grep -q "autonomousExecution" domainIntegration.js
          grep -q "humanAuthorizationRequired" domainIntegration.js

          echo "HUMAN AUTHORITY GOVERNANCE: VERIFIED"

      # =====================================================
      # ARM CONTROLLER
      # =====================================================

      - name: Verify ARM controller
        run: |
          set -e

          echo "Checking ARM controller..."

          grep -q "runSystemTest" armController.js
          grep -q "armSystem" armController.js
          grep -q "disarmSystem" armController.js
          grep -q "getArmStatus" armController.js

          echo "ARM CONTROLLER: PASS"

      # =====================================================
      # HTML
      # =====================================================

      - name: Verify HTML files
        run: |
          set -e

          echo "Checking SPD screens..."

          test -f index.html

          if [ -f cockpit_dashboard.html ]; then
            echo "cockpit_dashboard.html: PRESENT"
          fi

          if [ -f arm_screen.html ]; then
            echo "arm_screen.html: PRESENT"
          fi

          echo "HTML VALIDATION: PASS"

      # =====================================================
      # ASSESSMENT LATENCY
      # =====================================================

      - name: Verify Assessment Latency modules
        run: |
          set -e

          echo "=============================================="
          echo "Checking SPD v13.1 Assessment Latency modules"
          echo "=============================================="

          test -f assessment-latency/assessmentLatency.js
          test -f assessment-latency/assessmentLatencyDisplay.js
          test -f assessment-latency/assessmentLatencyDisplayWiring.js

          echo "Assessment Latency source: PRESENT"
          echo "Assessment Latency display: PRESENT"
          echo "Assessment Latency wiring: PRESENT"

          echo "ASSESSMENT LATENCY FILE VALIDATION: PASS"

      # =====================================================
      # ASSESSMENT LATENCY IMPORT VALIDATION
      # =====================================================

      - name: Verify Assessment Latency imports
        run: |
          set -e

          node --input-type=module <<'EOF'

          import * as latency
            from "./assessment-latency/assessmentLatency.js";

          import * as display
            from "./assessment-latency/assessmentLatencyDisplay.js";

          import * as wiring
            from "./assessment-latency/assessmentLatencyDisplayWiring.js";

          console.log("Assessment Latency source: PASS");
          console.log("Assessment Latency display: PASS");
          console.log("Assessment Latency wiring: PASS");

          if (
            typeof latency.getLatencyCatalogue !==
            "function"
          ) {
            throw new Error(
              "getLatencyCatalogue unavailable"
            );
          }

          if (
            typeof display.getAssessmentLatencyDisplay !==
            "function"
          ) {
            throw new Error(
              "getAssessmentLatencyDisplay unavailable"
            );
          }

          console.log(
            "ASSESSMENT LATENCY MODULE VALIDATION: PASS"
          );

          EOF

      # =====================================================
      # ASSESSMENT LATENCY ARCHITECTURE PROTECTION
      # =====================================================

      - name: Verify Assessment Latency measurement-only protection
        run: |
          set -e

          echo "Checking measurement-only architecture..."

          grep -q "MEASUREMENT" \
            assessment-latency/assessmentLatency.js

          grep -q "latency" \
            assessment-latency/assessmentLatency.js

          echo "Measurement-only source protection: PASS"

      # =====================================================
      # NODE MODULE IMPORT CHECK
      # =====================================================

      - name: Verify domain module integration
        run: |
          set -e

          node --input-type=module <<'EOF'

          import * as domainIntegration
            from "./domainIntegration.js";

          console.log(
            "domainIntegration.js imported successfully."
          );

          if (
            typeof domainIntegration.getDomainStatus !==
            "function"
          ) {
            throw new Error(
              "getDomainStatus() unavailable"
            );
          }

          console.log(
            "DOMAIN INTEGRATION IMPORT: PASS"
          );

          EOF

      # =====================================================
      # CORE ENGINE SELF CHECK
      # =====================================================

      - name: Run Core Engine Self-Check
        run: |
          set -e

          node --input-type=module <<'EOF'

          import {
            verifyCoreEngine
          } from "./engine.js";

          const result =
            verifyCoreEngine();

          console.log(
            JSON.stringify(result, null, 2)
          );

          if (result.status !== "PASS") {
            throw new Error(
              "Core engine self-check FAILED"
            );
          }

          console.log(
            "CORE ENGINE SELF-CHECK: PASS"
          );

          EOF

      # =====================================================
      # VALIDATION COMPLETE
      # =====================================================

      - name: Validation complete
        run: |
          echo "=============================================="
          echo "SPD v13.1 VALIDATION: PASS"
          echo "=============================================="
          echo "Core Engine              : PASS"
          echo "Domain Integration       : PASS"
          echo "Golden Rule              : PASS"
          echo "Human Authority          : VERIFIED"
          echo "ARM Controller           : PASS"
          echo "Assessment Latency       : PASS"
          echo "Latency Wiring           : PASS"
          echo "Measurement Only         : VERIFIED"
          echo "Decision Authority       : PROTECTED"
          echo "=============================================="


  # =========================================================
  # DEPLOYMENT
  # =========================================================

  deploy:
    name: Deploy SPD v13.1
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # =====================================================
      # PREPARE SITE
      # =====================================================

      - name: Prepare clean Pages site
        run: |

          set -e

          rm -rf _site
          mkdir -p _site

          echo "Preparing SPD v13.1 Pages site..."

          # -------------------------------------------------
          # CORE SCREENS
          # -------------------------------------------------

          cp index.html _site/

          if [ -f cockpit_dashboard.html ]; then
            cp cockpit_dashboard.html _site/
          fi

          if [ -f arm_screen.html ]; then
            cp arm_screen.html _site/
          fi

          # -------------------------------------------------
          # CORE ENGINES
          # -------------------------------------------------

          for file in \
            engine.js \
            captainAILena.js \
            goldenRuleEngine.js \
            armController.js \
            scenario.js \
            fx.js \
            energy.js \
            risk.js \
            domainIntegration.js
          do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          # -------------------------------------------------
          # DOMAINS
          # -------------------------------------------------

          for dir in FIN BHR DC CYB INF; do
            if [ -d "$dir" ]; then
              cp -r "$dir" _site/
            fi
          done

          # -------------------------------------------------
          # SUPPORT DIRECTORIES
          # -------------------------------------------------

          for dir in \
            constants \
            memory \
            rules \
            audit
          do
            if [ -d "$dir" ]; then
              cp -r "$dir" _site/
            fi
          done

          # -------------------------------------------------
          # ASSESSMENT LATENCY
          # -------------------------------------------------

          if [ ! -d assessment-latency ]; then
            echo "ERROR: assessment-latency directory missing."
            exit 1
          fi

          cp -r assessment-latency _site/

          # -------------------------------------------------
          # LATENCY DEPLOYMENT VERIFICATION
          # -------------------------------------------------

          echo "=============================================="
          echo "Assessment Latency deployment verification"
          echo "=============================================="

          test -f \
            _site/assessment-latency/assessmentLatency.js

          test -f \
            _site/assessment-latency/assessmentLatencyDisplay.js

          test -f \
            _site/assessment-latency/assessmentLatencyDisplayWiring.js

          echo "assessmentLatency.js                 : PASS"
          echo "assessmentLatencyDisplay.js         : PASS"
          echo "assessmentLatencyDisplayWiring.js   : PASS"

          echo "=============================================="
          echo "ASSESSMENT LATENCY DEPLOYMENT: PASS"
          echo "=============================================="

          # -------------------------------------------------
          # FINAL TREE
          # -------------------------------------------------

          echo "Deployment tree:"
          find _site -maxdepth 3 -type f | sort

      # =====================================================
      # UPLOAD
      # =====================================================

      - name: Upload SPD site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # =====================================================
      # DEPLOY
      # =====================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4