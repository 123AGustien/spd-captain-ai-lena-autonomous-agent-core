name: SPD v13.1 — Validate and Deploy

on:
  push:
    branches:
      - main
      - command-centre
      - feature/BHR-human-rights-compliance
      - feature/SPD-v13.1-performance-benchmark
      - feature/SPD-v13.1-assessment-latency-catalogue

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # =========================================================
  # VALIDATION
  # =========================================================

  validate:
    name: Validate SPD v13.1
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # =====================================================
      # CORE FILES
      # =====================================================

      - name: Verify Core JavaScript files
        run: |
          echo "Checking SPD core modules..."

          test -f engine.js
          test -f captainAILena.js
          test -f fx.js
          test -f energy.js
          test -f risk.js
          test -f scenario.js
          test -f armController.js
          test -f constants/math.constants.js

          echo "Core files present."

      # =====================================================
      # DOMAIN INTEGRATION
      # =====================================================

      - name: Verify Domain Integration Layer
        run: |
          echo "Checking domain integration..."

          test -f domainIntegration.js

          test -d FIN
          test -d BHR
          test -d DC
          test -d CYB
          test -d INF

          test -f FIN/finRuleEngine.js
          test -f BHR/BHRRuleEngine.js
          test -f DC/DCRuleEngine.js
          test -f CYB/CYBRuleEngine.js
          test -f INF/INFRuleEngine.js

          echo "Domain Integration files present."

      # =====================================================
      # DOMAIN ENGINE CONTENT
      # =====================================================

      - name: Verify domain engine exports
        run: |
          echo "Checking authoritative domain engines..."

          grep -q "evaluate" FIN/finRuleEngine.js
          grep -q "evaluate" BHR/BHRRuleEngine.js
          grep -q "evaluate" DC/DCRuleEngine.js
          grep -q "evaluate" CYB/CYBRuleEngine.js
          grep -q "evaluate" INF/INFRuleEngine.js

          echo "Domain evaluate() functions verified."

      # =====================================================
      # GOLDEN RULE
      # =====================================================

      - name: Verify Golden Rule pipeline
        run: |
          echo "Checking Golden Rule pipeline..."

          grep -q "OBSERVE" captainAILena.js
          grep -q "VERIFY" captainAILena.js
          grep -q "ASSESS" captainAILena.js
          grep -q "DECIDE" captainAILena.js
          grep -q "ACT" captainAILena.js
          grep -q "UPDATE" captainAILena.js

          echo "Golden Rule pipeline verified."

      # =====================================================
      # HUMAN AUTHORITY
      # =====================================================

      - name: Verify governance controls
        run: |
          echo "Checking human authority governance..."

          grep -q "HUMAN_OPERATOR" domainIntegration.js
          grep -q "autonomousExecution" domainIntegration.js
          grep -q "humanAuthorizationRequired" domainIntegration.js

          echo "Human authority governance verified."

      # =====================================================
      # ARM CONTROLLER
      # =====================================================

      - name: Verify ARM controller
        run: |
          echo "Checking ARM controller..."

          grep -q "runSystemTest" armController.js
          grep -q "armSystem" armController.js
          grep -q "disarmSystem" armController.js
          grep -q "getArmStatus" armController.js

          echo "ARM controller verified."

      # =====================================================
      # HTML
      # =====================================================

      - name: Verify HTML files
        run: |
          echo "Checking SPD screens..."

          test -f index.html
          test -f cockpit_dashboard.html
          test -f arm_screen.html

          echo "SPD screens present."

      # =====================================================
      # ASSESSMENT LATENCY
      # =====================================================

      - name: Verify Assessment Latency modules
        run: |
          echo "Checking SPD v13.1 Assessment Latency modules..."

          test -f assessment-latency/assessmentLatency.js
          test -f assessment-latency/assessmentLatencyDisplay.js
          test -f assessment-latency/assessmentLatencyDisplayWiring.js

          echo "Assessment Latency modules present."

      # =====================================================
      # ASSESSMENT LATENCY IMPORT VALIDATION
      # =====================================================

      - name: Verify Assessment Latency imports
        run: |
          node --input-type=module <<'EOF'

          import * as latency
            from "./assessment-latency/assessmentLatency.js";

          import * as display
            from "./assessment-latency/assessmentLatencyDisplay.js";

          import * as wiring
            from "./assessment-latency/assessmentLatencyDisplayWiring.js";

          console.log(
            "Assessment Latency source: PASS"
          );

          console.log(
            "Assessment Latency display: PASS"
          );

          console.log(
            "Assessment Latency wiring: PASS"
          );

          if (
            typeof latency.getLatencyCatalogue !==
            "function"
          ) {
            throw new Error(
              "getLatencyCatalogue unavailable"
            );
          }

          if (
            typeof latency.getLatencyStatistics !==
            "function"
          ) {
            throw new Error(
              "getLatencyStatistics unavailable"
            );
          }

          if (
            typeof display.getAssessmentLatencyDisplay !==
            "function"
          ) {
            throw new Error(
              "getAssessmentLatencyDisplay unavailable"
            );
          }

          if (
            typeof display.verifyAssessmentLatencyDisplay !==
            "function"
          ) {
            throw new Error(
              "verifyAssessmentLatencyDisplay unavailable"
            );
          }

          if (
            Object.keys(wiring).length === 0
          ) {
            throw new Error(
              "Assessment Latency wiring module exports are empty"
            );
          }

          console.log(
            "ASSESSMENT LATENCY MODULE VALIDATION: PASS"
          );

          EOF

      # =====================================================
      # ASSESSMENT LATENCY DISPLAY SELF-TEST
      # =====================================================

      - name: Run Assessment Latency Display Self-Test
        run: |
          node --input-type=module <<'EOF'

          import {
            getAssessmentLatencyDisplay,
            verifyAssessmentLatencyDisplay
          } from "./assessment-latency/assessmentLatencyDisplay.js";

          const display =
            getAssessmentLatencyDisplay();

          console.log(
            JSON.stringify(
              display,
              null,
              2
            )
          );

          const verification =
            verifyAssessmentLatencyDisplay();

          console.log(
            JSON.stringify(
              verification,
              null,
              2
            )
          );

          if (
            verification.status !==
            "PASS"
          ) {
            throw new Error(
              "Assessment Latency Display verification FAILED"
            );
          }

          if (
            display.measurementOnly !==
            true
          ) {
            throw new Error(
              "Assessment Latency is not measurement-only"
            );
          }

          if (
            display.mode !==
            "MEASUREMENT_ONLY"
          ) {
            throw new Error(
              "Assessment Latency mode is invalid"
            );
          }

          console.log(
            "ASSESSMENT LATENCY DISPLAY SELF-TEST: PASS"
          );

          EOF

      # =====================================================
      # ASSESSMENT LATENCY PROTECTION CHECK
      # =====================================================

      - name: Verify Assessment Latency architecture protection
        run: |
          node --input-type=module <<'EOF'

          import {
            getAssessmentLatencyDisplay
          } from "./assessment-latency/assessmentLatencyDisplay.js";

          const display =
            getAssessmentLatencyDisplay();

          const protection =
            display.protection;

          const requiredProtection = [
            "goldenRuleEngine",
            "domainRuleEngines",
            "domainThresholds",
            "riskClassification",
            "resilienceCalculations",
            "decisions",
            "actions",
            "humanDecisionAuthority",
            "cockpitControls"
          ];

          for (
            const key of requiredProtection
          ) {

            if (
              !protection ||
              protection[key] !==
              "UNCHANGED"
            ) {

              throw new Error(
                `Architecture protection failed: ${key}`
              );

            }

          }

          console.log(
            "Architecture protection: PASS"
          );

          console.log(
            "Golden Rule Engine: UNCHANGED"
          );

          console.log(
            "Domain Rule Engines: UNCHANGED"
          );

          console.log(
            "Domain Thresholds: UNCHANGED"
          );

          console.log(
            "Risk Classification: UNCHANGED"
          );

          console.log(
            "Resilience Calculations: UNCHANGED"
          );

          console.log(
            "Decision Logic: UNCHANGED"
          );

          console.log(
            "Action Logic: UNCHANGED"
          );

          console.log(
            "Human Decision Authority: UNCHANGED"
          );

          console.log(
            "Cockpit Controls: UNCHANGED"
          );

          EOF

      # =====================================================
      # NODE MODULE IMPORT CHECK
      # =====================================================

      - name: Verify domain module imports
        run: |
          node --input-type=module <<'EOF'

          import * as domainIntegration
            from "./domainIntegration.js";

          const required = [
            "FIN",
            "BHR",
            "DC",
            "CYB",
            "INF"
          ];

          for (
            const domain of required
          ) {

            const status =
              domainIntegration.getDomainStatus(
                domain
              );

            if (
              !status.engineRegistered
            ) {

              throw new Error(
                `${domain} engine not registered`
              );

            }

            if (
              !status.evaluateAvailable
            ) {

              throw new Error(
                `${domain} evaluate() unavailable`
              );

            }

          }

          console.log(
            "All five domain engines imported and registered."
          );

          EOF

      # =====================================================
      # DOMAIN INTEGRATION SELF TEST
      # =====================================================

      - name: Run Domain Integration Self-Test
        run: |
          node --input-type=module <<'EOF'

          import {
            selfTest,
            verifyDomainIntegration
          } from "./domainIntegration.js";

          const result =
            selfTest();

          console.log(
            JSON.stringify(
              result,
              null,
              2
            )
          );

          if (
            result.status !==
            "PASS"
          ) {

            throw new Error(
              "Domain integration self-test FAILED"
            );

          }

          const verification =
            verifyDomainIntegration();

          if (
            verification.status !==
            "READY"
          ) {

            throw new Error(
              "Domain integration is not READY"
            );

          }

          console.log(
            "DOMAIN INTEGRATION SELF-TEST: PASS"
          );

          EOF

      # =====================================================
      # SYSTEM INTEGRATION TEST
      # =====================================================

      - name: Run Domain Integration System Test
        run: |
          if [ -f domainIntegration.test.js ]; then

            node domainIntegration.test.js

          elif [ -f tests/domainIntegration.test.js ]; then

            node tests/domainIntegration.test.js

          else

            echo "ERROR: Domain integration system test not found."
            exit 1

          fi

      # =====================================================
      # CORE → DOMAIN END-TO-END TEST
      # =====================================================

      - name: Run Core-to-Domain End-to-End Test
        run: |
          if [ -f coreDomainE2E.test.js ]; then

            node coreDomainE2E.test.js

          elif [ -f tests/coreDomainE2E.test.js ]; then

            node tests/coreDomainE2E.test.js

          else

            echo "ERROR: Core-to-Domain E2E test not found."
            exit 1

          fi

      # =====================================================
      # CORE ENGINE SELF CHECK
      # =====================================================

      - name: Run Core Engine Self-Check
        run: |
          node --input-type=module <<'EOF'

          import {
            verifyCoreEngine
          } from "./engine.js";

          const result =
            verifyCoreEngine();

          console.log(
            JSON.stringify(
              result,
              null,
              2
            )
          );

          if (
            result.status !==
            "PASS"
          ) {

            throw new Error(
              "Core engine self-check FAILED"
            );

          }

          console.log(
            "CORE ENGINE SELF-CHECK: PASS"
          );

          EOF

      # =====================================================
      # VALIDATION COMPLETE
      # =====================================================

      - name: Validation complete
        run: |
          echo "=============================================="
          echo "SPD v13.1 VALIDATION: PASS"
          echo "=============================================="
          echo "Core Engine              : PASS"
          echo "Domain Integration       : PASS"
          echo "FIN                      : PASS"
          echo "BHR                      : PASS"
          echo "DC                       : PASS"
          echo "CYB                      : PASS"
          echo "INF                      : PASS"
          echo "Golden Rule              : PASS"
          echo "Human Authority          : VERIFIED"
          echo "Autonomous Execution     : DISABLED"
          echo "Core-to-Domain E2E       : PASS"
          echo "Assessment Latency       : PASS"
          echo "Latency Display          : PASS"
          echo "Latency Wiring           : PASS"
          echo "Measurement Only         : VERIFIED"
          echo "Architecture Protection  : ACTIVE"
          echo "=============================================="


  # =========================================================
  # DEPLOYMENT
  # =========================================================

  deploy:
    name: Deploy SPD v13.1
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # =====================================================
      # PREPARE COMPLETE SITE
      # =====================================================

      - name: Prepare clean Pages site
        run: |

          rm -rf _site

          mkdir -p _site

          # -------------------------------------------------
          # CORE SCREENS
          # -------------------------------------------------

          cp index.html _site/

          if [ -f cockpit_dashboard.html ]; then
            cp cockpit_dashboard.html _site/
          fi

          if [ -f arm_screen.html ]; then
            cp arm_screen.html _site/
          fi

          # -------------------------------------------------
          # CORE ENGINES
          # -------------------------------------------------

          if [ -f engine.js ]; then
            cp engine.js _site/
          fi

          if [ -f captainAILena.js ]; then
            cp captainAILena.js _site/
          fi

          if [ -f goldenRuleEngine.js ]; then
            cp goldenRuleEngine.js _site/
          fi

          if [ -f armController.js ]; then
            cp armController.js _site/
          fi

          if [ -f scenario.js ]; then
            cp scenario.js _site/
          fi

          if [ -f fx.js ]; then
            cp fx.js _site/
          fi

          if [ -f energy.js ]; then
            cp energy.js _site/
          fi

          if [ -f risk.js ]; then
            cp risk.js _site/
          fi

          # -------------------------------------------------
          # DOMAIN INTEGRATION
          # -------------------------------------------------

          if [ -f domainIntegration.js ]; then
            cp domainIntegration.js _site/
          fi

          # -------------------------------------------------
          # FIN
          # -------------------------------------------------

          if [ -d FIN ]; then
            cp -r FIN _site/
          fi

          # -------------------------------------------------
          # BHR
          # -------------------------------------------------

          if [ -d BHR ]; then
            cp -r BHR _site/
          fi

          # -------------------------------------------------
          # DC
          # -------------------------------------------------

          if [ -d DC ]; then
            cp -r DC _site/
          fi

          # -------------------------------------------------
          # CYB
          # -------------------------------------------------

          if [ -d CYB ]; then
            cp -r CYB _site/
          fi

          # -------------------------------------------------
          # INF
          # -------------------------------------------------

          if [ -d INF ]; then
            cp -r INF _site/
          fi

          # -------------------------------------------------
          # CONSTANTS
          # -------------------------------------------------

          if [ -d constants ]; then
            cp -r constants _site/
          fi

          # -------------------------------------------------
          # MEMORY
          # -------------------------------------------------

          if [ -d memory ]; then
            cp -r memory _site/
          fi

          # -------------------------------------------------
          # RULES
          # -------------------------------------------------

          if [ -d rules ]; then
            cp -r rules _site/
          fi

          # -------------------------------------------------
          # AUDIT
          # -------------------------------------------------

          if [ -d audit ]; then
            cp -r audit _site/
          fi

          # -------------------------------------------------
          # ASSESSMENT LATENCY
          # -------------------------------------------------

          if [ -d assessment-latency ]; then

            cp -r assessment-latency _site/

          else

            echo "ERROR: assessment-latency directory missing."
            exit 1

          fi

          # -------------------------------------------------
          # VERIFY DEPLOYMENT TREE
          # -------------------------------------------------

          echo "=============================================="
          echo "Complete SPD v13.1 Pages site prepared."
          echo "=============================================="

          echo "Assessment Latency deployment files:"

          find _site/assessment-latency \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo "=============================================="

          test -f \
            _site/assessment-latency/assessmentLatency.js

          test -f \
            _site/assessment-latency/assessmentLatencyDisplay.js

          test -f \
            _site/assessment-latency/assessmentLatencyDisplayWiring.js

          echo "Assessment Latency deployment verification: PASS"

          echo "=============================================="
          echo "Deployment tree:"
          find _site -maxdepth 3 -type f | sort
          echo "=============================================="

      # =====================================================
      # UPLOAD
      # =====================================================

      - name: Upload SPD site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # =====================================================
      # DEPLOY
      # =====================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
