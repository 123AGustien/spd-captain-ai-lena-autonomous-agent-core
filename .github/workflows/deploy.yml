name: Deploy SPD v13.1 Mobile Cockpit

on:
  push:
    branches:
      - main
      - feature/spd-v13-sextant-resilience
      - feature/BHR-human-rights-compliance

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload SPD v13.1 Mobile Cockpit
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy SPD v13.1 Cockpit
        id: deployment
        uses: actions/deploy-pages@v4