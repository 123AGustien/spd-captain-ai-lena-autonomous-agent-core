<script type="module">

/*
============================================================
SPD v13.1 — MOBILE COCKPIT CONNECTION LAYER

COCKPIT UI
      ↓
SCENARIO INPUT
      ↓
DOMAIN INTEGRATION
      ↓
DOMAIN RULE ENGINE
      ↓
GOLDEN RULE ENGINE
      ↓
CAPTAIN AI LENA DECISION CORE
      ↓
MEMORY CORE
      ↓
AUDIT RECORD

============================================================
*/


import {

    executeDomainRule,
    getDomainStatus,
    buildDecisionContext,
    validateDecisionContext

}

from "./domainIntegration.js";



let currentScenario = "NORMAL";

let scenarioIntensity = 50;



function setText(id,value){

    const element =
    document.getElementById(id);

    if(!element) return;


    element.innerText =

    typeof value === "string"

    ?

    value

    :

    JSON.stringify(
        value,
        null,
        2
    );

}



/*
============================================================
SCENARIO CONTROL
============================================================
*/


window.activateScenario =
function(name){

    currentScenario = name;


    setText(

        "scenarioPanel",

        {

            scenario:name,

            intensity:
            scenarioIntensity + "%",

            status:
            "ACTIVE"

        }

    );

};



window.updateIntensity =
function(){

    const slider =
    document.getElementById(
        "scenarioIntensity"
    );


    scenarioIntensity =
    Number(
        slider.value
    );


    setText(

        "intensityValue",

        scenarioIntensity + "%"

    );

};



window.resetScenario =
function(){

    currentScenario="NORMAL";

    scenarioIntensity=0;


    setText(

        "scenarioPanel",

        {

            scenario:
            "NORMAL",

            status:
            "RESET"

        }

    );

};



/*
============================================================
SYSTEM STATE BUILDER
============================================================
*/


function buildSystemState(){


return {


scenario:
currentScenario,


event:
currentScenario,


intensity:
scenarioIntensity,


fx:
scenarioIntensity,


dc:
scenarioIntensity,


cyb:
scenarioIntensity,


inf:
scenarioIntensity,


energy:
100 - scenarioIntensity,


humanRightsCompliance:
scenarioIntensity,


workerSafety:
scenarioIntensity,


supplyChain:
scenarioIntensity,


governance:
scenarioIntensity,


communityImpact:
scenarioIntensity,


mode:
"AUTONOMOUS",


time:
new Date()
.toISOString()


};

}



/*
============================================================
RUN LIVE SYSTEM
============================================================
*/


window.runLiveSystem =
async function(){


try{


const state =
buildSystemState();



setText(
"state",
state
);



const domainResult =

await executeDomainRule(

currentScenario,

state

);



const context =

buildDecisionContext(

domainResult,

{

scenario:
currentScenario

}

);



const validation =

validateDecisionContext(

context

);



setText(

"assessment",

domainResult

);



setText(

"riskPanel",

{

domain:
domainResult.domain,

status:
domainResult.status,

validation:
validation.status

}

);



setText(

"decision",

{

captainAILena:

"DECISION CORE ACTIVE",

context

}

);



setText(

"memoryCore",

{

status:
"MEMORY CORE UPDATED",

scenario:
currentScenario

}

);



setText(

"audit",

{

system:
"SPD v13.1",

scenario:
currentScenario,

domain:
domainResult.domain,

authority:
"GOLDEN RULE ENGINE",

decisionCore:
"CAPTAIN AI LENA",

validation:
validation.status,

timestamp:
new Date()
.toISOString()

}

);



setText(

"pipelineLog",

`

SCENARIO INPUT

↓

DOMAIN INTEGRATION

↓

DOMAIN RULE ENGINE

↓

GOLDEN RULE ENGINE

↓

CAPTAIN AI LENA

↓

AUDIT RECORD


STATUS: COMPLETE

`

);



setText(

"systemStatus",

"SYSTEM STATUS: AUTONOMOUS ENGINE RUNNING"

);


}


catch(error){


setText(

"systemStatus",

"SYSTEM ERROR"

);


setText(

"audit",

error.message

);


}


};



/*
============================================================
SELF TEST
============================================================
*/


window.runAuthoritativeSelfTest =
function(){


setText(

"selfTest",

{

engine:
"SPD v13.1",

status:
"SELF TEST READY",

authority:
"GOLDEN RULE ENGINE"

}

);


};



/*
============================================================
CORRECTIVE ACTION
============================================================
*/


window.runCorrectiveAction =
function(){


setText(

"correctiveAction",

{

authority:
"CAPTAIN AI LENA",

status:
"CORRECTIVE ACTION FRAMEWORK ACTIVE"

}

);


};



/*
============================================================
INITIAL STATUS
============================================================
*/


setText(

"constants",

{

version:
"SPD v13.1",

architecture:
"DETERMINISTIC",

machineLearning:
false,

randomness:
false,

phi:
1.618033988749895

}

);


console.log(

"SPD v13.1 MOBILE COCKPIT CONNECTED",

getDomainStatus()

);


</script>
