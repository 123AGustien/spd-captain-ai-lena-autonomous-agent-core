<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPD Simulation Screen</title>

  <style>
    body {
      background: #05070a;
      color: #00ff99;
      font-family: monospace;
      padding: 15px;
    }

    h2 {
      color: white;
    }

    .panel {
      border: 1px solid #00ff99;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 10px;
      background: #111;
      color: #00ff99;
      border: 1px solid #00ff99;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #00ff99;
      color: #000;
      font-weight: bold;
      border: none;
    }

    .arm-button {
      margin-top: 10px;
      background: #ffaa00;
    }

    .arm-status {
      color: #ffaa00;
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
    }

    .flow {
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

<h2>🧠 SPD LIVE SIMULATION SCREEN</h2>

<div class="panel">
  <label>FX</label>
  <input id="fx" type="number" value="10">

  <label>ENERGY</label>
  <input id="energy" type="number" value="50">

  <label>CYB</label>
  <input id="cyb" type="number" value="50">

  <button onclick="run()">RUN SIMULATION</button>
</div>

<div class="panel">
  <h3>📥 INPUT</h3>
  <pre id="input">Waiting...</pre>
</div>

<div class="panel">
  <h3>⚙️ OUTPUT</h3>
  <pre id="output">Idle</pre>
</div>

<div class="panel">
  <h3>🔁 FLOW</h3>
  <div class="flow">
    OBSERVE → VERIFY → ASSESS → DECIDE → ACT → UPDATE
  </div>
</div>

<!-- ARM SCREEN -->

<div class="panel">
  <h3>🔐 ARM / EXECUTION AUTHORITY</h3>

  <div class="arm-status" id="armStatus">
    SYSTEM NOT ARMED
  </div>

  <pre id="armOutput">
Execution gate: SAFE
Authorization: PENDING
Action execution: BLOCKED
  </pre>

  <button class="arm-button" onclick="armSystem()">
    🔐 ARM SYSTEM
  </button>

  <button onclick="disarmSystem()">
    🔒 DISARM SYSTEM
  </button>
</div>

<script type="module">

  import { runEngine } from "./engine.js";

  let systemArmed = false;

  window.run = function () {

    const state = {
      fx: Number(document.getElementById("fx").value),
      energy: Number(document.getElementById("energy").value),
      cyb: Number(document.getElementById("cyb").value)
    };

    const result = runEngine(state);

    document.getElementById("input").innerText =
      JSON.stringify(result.input, null, 2);

    document.getElementById("output").innerText =
      JSON.stringify(result.output, null, 2);

    updateArmDisplay(result);
  };


  window.armSystem = function () {

    systemArmed = true;

    document.getElementById("armStatus").innerText =
      "SYSTEM ARMED";

    document.getElementById("armOutput").innerText =
      "Execution gate: ARMED\n" +
      "Authorization: ENABLED\n" +
      "Action execution: PERMITTED";
  };


  window.disarmSystem = function () {

    systemArmed = false;

    document.getElementById("armStatus").innerText =
      "SYSTEM NOT ARMED";

    document.getElementById("armOutput").innerText =
      "Execution gate: SAFE\n" +
      "Authorization: PENDING\n" +
      "Action execution: BLOCKED";
  };


  function updateArmDisplay(result) {

    if (!result || !result.output) {
      return;
    }

    const decision =
      result.output.decision || {};

    const action =
      decision.action || "NO ACTION";

    const authorization =
      systemArmed
        ? "ENABLED"
        : "PENDING";

    const execution =
      systemArmed
        ? "PERMITTED"
        : "BLOCKED";

    document.getElementById("armOutput").innerText =
      "Execution gate: " +
      (systemArmed ? "ARMED" : "SAFE") +
      "\n" +
      "Authorization: " +
      authorization +
      "\n" +
      "Action: " +
      action +
      "\n" +
      "Action execution: " +
      execution;
  }

</script>

</body>
</html>
