let currentScenario = "NORMAL";


let scenarioIntensity = 50;




function setText(id,value){

    const element =
    document.getElementById(id);


    if(!element)return;


    element.innerText =

    typeof value === "string"

    ?

    value

    :

    JSON.stringify(
        value,
        null,
        2
    );

}




window.activateScenario=function(name){

    currentScenario = name;


    setText(
        "scenarioPanel",
        {
            activeScenario:name,
            intensity:scenarioIntensity
        }
    );


    console.log(
        "Scenario Activated:",
        name
    );

};






window.updateIntensity=function(){

    const slider =
    document.getElementById(
        "scenarioIntensity"
    );


    if(slider){

        scenarioIntensity =
        Number(slider.value);


        setText(
            "intensityValue",
            scenarioIntensity + "%"
        );

    }

};







function buildSystemState(){


return {


    scenario:
        currentScenario,


    event:
        currentScenario,


    intensity:
        scenarioIntensity,



    humanRightsCompliance:
        scenarioIntensity,


    workerSafety:
        scenarioIntensity,


    supplyChain:
        scenarioIntensity,


    governance:
        scenarioIntensity,


    communityImpact:
        scenarioIntensity,



    mode:
        "AUTONOMOUS",



    time:
        new Date()
        .toISOString()


};


}








window.runLiveSystem=function(){


const state =
buildSystemState();




setText(
    "state",
    state
);




try{


const result =


executeDomainRule(

    currentScenario,

    state

);





setText(

    "assessment",

    result.assessment ??

    result

);





setText(

    "decision",

    result.captainAILena ??

    result.bridgeResult ??

    result

);





setText(

    "audit",

    {

        scenario:
        currentScenario,


        domain:
        result.domain,


        status:
        "VALIDATED",


        timestamp:
        new Date()
        .toISOString()

    }

);





setText(

    "systemStatus",

    "SYSTEM STATUS: AUTONOMOUS ENGINE RUNNING"

);




}

catch(error){


setText(

"faultIdentification",

error.message

);


}


};
