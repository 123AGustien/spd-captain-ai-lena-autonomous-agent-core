<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPD v13.1 ARM Control</title>

  <style>
    body{
      background:#05070a;
      color:#00ff99;
      font-family:monospace;
      padding:20px;
    }

    h1{
      color:white;
    }

    .panel{
      border:1px solid #00ff99;
      border-radius:6px;
      padding:15px;
      margin-bottom:15px;
    }

    button{
      width:100%;
      padding:10px;
      margin:6px 0;
      background:#00ff99;
      color:black;
      font-weight:bold;
      border:none;
      cursor:pointer;
    }

    pre{
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

<h1>🛰️ SPD v13.1 ARM CONTROL</h1>

<div class="panel">

<button onclick="runSystemTestButton()">
▶ RUN SYSTEM TEST
</button>

<button onclick="runTestButton()">
🧪 RUN TEST
</button>

<button onclick="armButton()">
🟢 ARM SYSTEM
</button>

<button onclick="disarmButton()">
🔴 DISARM SYSTEM
</button>

</div>

<div class="panel">
<h3>ARM STATUS</h3>
<pre id="status">DISARMED</pre>
</div>

<div class="panel">
<h3>SYSTEM OUTPUT</h3>
<pre id="output">Waiting...</pre>
</div>

<script type="module">

import {
  armSystem,
  disarmSystem,
  runSystemTest,
  runTest,
  getArmStatus
} from "./armController.js";

window.armButton = function () {

  const result = armSystem();

  document.getElementById("status").innerText =
    JSON.stringify(getArmStatus(), null, 2);

  document.getElementById("output").innerText =
    JSON.stringify(result, null, 2);
};

window.disarmButton = function () {

  const result = disarmSystem();

  document.getElementById("status").innerText =
    JSON.stringify(getArmStatus(), null, 2);

  document.getElementById("output").innerText =
    JSON.stringify(result, null, 2);
};

window.runSystemTestButton = function () {

  const result = runSystemTest();

  document.getElementById("output").innerText =
    JSON.stringify(result, null, 2);
};

window.runTestButton = function () {

  const result = runTest();

  document.getElementById("status").innerText =
    JSON.stringify(getArmStatus(), null, 2);

  document.getElementById("output").innerText =
    JSON.stringify(result, null, 2);
};

</script>

</body>
</html>
